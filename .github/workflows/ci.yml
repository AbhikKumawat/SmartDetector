name: Web3 Sentinel CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  contracts-test:
    name: Foundry Smart Contract Exploitation & Remediation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build Contracts
        run: |
          cd contracts
          forge build --sizes

      - name: Run Exploit PoC & Patch Verification Tests
        run: |
          cd contracts
          forge test -vvv

  backend-test:
    name: FastAPI & Static Analysis Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install slither-analyzer pytest httpx

      - name: Compile Test Contracts
        run: |
          cd contracts
          forge build

      - name: Run Pytest Suite
        run: |
          export PYTHONPATH=.
          pytest backend/tests -v

  frontend-build:
    name: Next.js Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Next.js Production Build
        run: |
          cd frontend
          npm run build
