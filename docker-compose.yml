version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinel-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/backend/sentinel.db
      - FOUNDRY_BIN_DIR=/root/.foundry/bin
      - FORGE_PATH=/root/.foundry/bin/forge
      - SLITHER_PATH=slither
    volumes:
      - sentinel-db:/app/backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sentinel-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sentinel-db:
