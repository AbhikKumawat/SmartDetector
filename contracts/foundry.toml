[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.20"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

# Permissions for testing and cheatcodes
fs_permissions = [{ access = "read-write", path = "./" }]
verbosity = 2
